<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizoLife AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 2.5em; font-weight: bold; }
        .tagline { font-size: 1.1em; opacity: 0.9; margin-top: 5px; }
        .section {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .section-title { font-size: 1.3em; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover { background: rgba(255,255,255,0.1); }
        .upload-area.has-image { padding: 10px; }
        .upload-area img { max-width: 100%; max-height: 250px; border-radius: 10px; }
        .upload-icon { font-size: 3em; margin-bottom: 10px; }
        .btn {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 18px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.show { display: block; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result { display: none; margin-top: 20px; text-align: center; }
        .result.show { display: block; }
        .result img { max-width: 100%; border-radius: 15px; margin-top: 10px; }
        .error { color: #ff6b6b; text-align: center; margin-top: 10px; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">👗 VizoLife AI</div>
            <div class="tagline">Карманная AI-примерочная</div>
        </div>
        <div class="section">
            <div class="section-title"><span>📸</span><span>Твоё фото</span></div>
            <div class="upload-area" id="photoUpload">
                <div class="upload-icon">📷</div>
                <div>Нажми чтобы загрузить фото</div>
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none">
        </div>
        <div class="section">
            <div class="section-title"><span>👕</span><span>Одежда</span></div>
            <div class="upload-area" id="clothesUpload">
                <div class="upload-icon">👕</div>
                <div>Загрузи фото одежды</div>
            </div>
            <input type="file" id="clothesInput" accept="image/*" style="display:none">
        </div>
        <button class="btn" id="tryOnBtn">✨ Примерить</button>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>AI создаёт твой образ... (30-60 сек)</div>
        </div>
        <div class="error" id="error"></div>
        <div class="result" id="result">
            <div class="section-title"><span>🎉</span><span>Результат</span></div>
            <div id="resultImage"></div>
        </div>
    </div>
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        const API_URL = "http://5.181.253.139:8001";
        let personBlob = null;
        let garmentBlob = null;
        function setupUpload(uploadEl, inputEl) {
            uploadEl.addEventListener('click', () => inputEl.click());
            inputEl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (inputEl.id === 'photoInput') personBlob = file;
                    else garmentBlob = file;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        uploadEl.innerHTML = '<img src="' + ev.target.result + '">';
                        uploadEl.classList.add('has-image');
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        setupUpload(document.getElementById('photoUpload'), document.getElementById('photoInput'));
        setupUpload(document.getElementById('clothesUpload'), document.getElementById('clothesInput'));
        document.getElementById('tryOnBtn').addEventListener('click', async () => {
            const photoUpload = document.getElementById('photoUpload');
            const clothesUpload = document.getElementById('clothesUpload');
            if (!photoUpload.classList.contains('has-image') || !clothesUpload.classList.contains('has-image')) {
                alert('Загрузи фото себя и одежду!');
                return;
            }
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');
            const btn = document.getElementById('tryOnBtn');
            loading.classList.add('show');
            result.classList.remove('show');
            error.classList.remove('show');
            btn.disabled = true;
            const formData = new FormData();
            formData.append('person_image', personBlob);
            formData.append('garment_image', garmentBlob);
            try {
                const response = await fetch(API_URL + '/try-on', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    loading.classList.remove('show');
                    result.classList.add('show');
                    document.getElementById('resultImage').innerHTML = '<img src="' + data.result + '">';
                } else {
                    throw new Error(data.detail || 'Ошибка AI');
                }
            } catch (err) {
                loading.classList.remove('show');
                error.textContent = 'Ошибка: ' + err.message;
                error.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
