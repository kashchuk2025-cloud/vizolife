<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizoLife AI - Карманная примерочная</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .section {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.5);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .upload-area:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
        }
        .upload-area.has-image {
            padding: 10px;
        }
        .upload-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
        }
        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .category {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .category:hover {
            background: rgba(255,255,255,0.3);
        }
        .category.active {
            border-color: #fff;
            background: rgba(255,255,255,0.3);
        }
        .category-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        .btn {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            text-align: center;
        }
        .result img {
            max-width: 100%;
            border-radius: 15px;
            margin-top: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">👗 VizoLife AI</div>
            <div class="tagline">Карманная примерочная</div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>📸</span>
                <span>Твоё фото</span>
            </div>
            <div class="upload-area" id="photoUpload">
                <div class="upload-icon">📷</div>
                <div>Нажми чтобы загрузить фото</div>
            </div>
            <input type="file" id="photoInput" accept="image/*" style="display:none">
        </div>

        <div class="section">
            <div class="section-title">
                <span>👕</span>
                <span>Одежда</span>
            </div>
            <div class="categories">
                <div class="category" data-type="women">
                    <div class="category-icon">👗</div>
                    <div>Женское</div>
                </div>
                <div class="category" data-type="men">
                    <div class="category-icon"></div>
                    <div>Мужское</div>
                </div>
                <div class="category" data-type="kids">
                    <div class="category-icon">👶</div>
                    <div>Детское</div>
                </div>
                <div class="category" data-type="shoes">
                    <div class="category-icon">👟</div>
                    <div>Обувь</div>
                </div>
            </div>
            <div class="upload-area" id="clothesUpload">
                <div class="upload-icon">👕</div>
                <div>Загрузи фото одежды</div>
            </div>
            <input type="file" id="clothesInput" accept="image/*" style="display:none">
        </div>

        <div class="section">
            <div class="section-title">
                <span>💄</span>
                <span>Макияж и причёска</span>
            </div>
            <div class="categories">
                <div class="category" data-type="makeup">
                    <div class="category-icon">💄</div>
                    <div>Макияж</div>
                </div>
                <div class="category" data-type="hair">
                    <div class="category-icon">💇</div>
                    <div>Причёска</div>
                </div>
            </div>
        </div>

        <button class="btn" id="tryOnBtn">✨ Примерить</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>AI создаёт твой новый образ...</div>
        </div>

        <div class="result" id="result">
            <div class="section-title">
                <span>🎉</span>
                <span>Результат</span>
            </div>
            <div id="resultImage"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Загрузка фото
        const photoUpload = document.getElementById('photoUpload');
        const photoInput = document.getElementById('photoInput');
        
        photoUpload.addEventListener('click', () => photoInput.click());
        
        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    photoUpload.innerHTML = `<img src="${e.target.result}" alt="Твоё фото">`;
                    photoUpload.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        });

        // Загрузка одежды
        const clothesUpload = document.getElementById('clothesUpload');
        const clothesInput = document.getElementById('clothesInput');
        
        clothesUpload.addEventListener('click', () => clothesInput.click());
        
        clothesInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    clothesUpload.innerHTML = `<img src="${e.target.result}" alt="Одежда">`;
                    clothesUpload.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        });

        // Выбор категории
        document.querySelectorAll('.category').forEach(cat => {
            cat.addEventListener('click', () => {
                const type = cat.dataset.type;
                const parent = cat.parentElement;
                parent.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                cat.classList.add('active');
            });
        });

        // Кнопка примерки
        const tryOnBtn = document.getElementById('tryOnBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        tryOnBtn.addEventListener('click', () => {
            // Проверяем что загружены оба фото
            if (!photoUpload.classList.contains('has-image') || !clothesUpload.classList.contains('has-image')) {
                alert('Загрузи фото себя и одежду!');
                return;
            }

            // Показываем загрузку
            loading.classList.add('show');
            result.style.display = 'none';

            // Отправляем данные на сервер
            const photoData = photoUpload.querySelector('img').src;
            const clothesData = clothesUpload.querySelector('img').src;
            const category = document.querySelector('.category.active')?.dataset.type || 'women';

            fetch('https://api.vizolife.ru/try-on', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    photo: photoData,
                    clothes: clothesData,
                    category: category
                })
            })
            .then(response => response.json())
            .then(data => {
                loading.classList.remove('show');
                result.style.display = 'block';
                
                if (data.success) {
                    document.getElementById('resultImage').innerHTML = `
                        <img src="${data.result}" alt="Результат">
                        <button class="btn" style="margin-top: 20px;">💾 Сохранить образ</button>
                    `;
                } else {
                    alert('Ошибка: ' + data.error);
                }
            })
            .catch(error => {
                loading.classList.remove('show');
                alert('Ошибка сервера. Попробуй позже.');
                console.error(error);
            });
        });
    </script>
</body>
</html>
